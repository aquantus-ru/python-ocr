<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processing...</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
        .container { border: 1px solid #ccc; padding: 40px; border-radius: 5px; margin-top: 50px; }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-container {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 20px;
            height: 25px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #3498db;
            text-align: center;
            line-height: 25px;
            color: white;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Processing PDF...</h1>
        <p>Please wait. The results will appear here automatically when finished.</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">0%</div>
        </div>
        <p id="progress-text"><small>Initializing...</small></p>
        <p><small>Job ID: {{ job_id }}</small></p>
    </div>

    <script>
        const jobId = "{{ job_id }}";
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        function updateProgress() {
            fetch(`/status/${jobId}?format=json`)
                .then(response => {
                    if (!response.ok) {
                         // If 404, maybe it's done but we missed the window, or just redirect to status page to handle it
                         if (response.status === 404) {
                             window.location.reload();
                         }
                         throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'finished') {
                        progressBar.style.width = '100%';
                        progressBar.innerText = '100%';
                        progressText.innerHTML = '<small>Processing complete. Redirecting...</small>';
                        // Reload page to trigger the redirect in the standard view
                        window.location.href = `/status/${jobId}`;
                    } else if (data.status === 'processing') {
                        const current = data.current;
                        const total = data.total;
                        let percent = 0;
                        if (total > 0) {
                            percent = Math.round((current / total) * 100);
                        }

                        progressBar.style.width = `${percent}%`;
                        progressBar.innerText = `${percent}%`;
                        progressText.innerHTML = `<small>Processing page ${current} of ${total}</small>`;

                        // Schedule next update
                        setTimeout(updateProgress, 1000);
                    } else if (data.status === 'failed') {
                        progressText.innerHTML = '<small>Processing failed.</small>';
                        window.location.href = `/status/${jobId}`;
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    // Retry after a delay
                    setTimeout(updateProgress, 2000);
                });
        }

        // Start polling
        setTimeout(updateProgress, 1000);
    </script>
</body>
</html>
